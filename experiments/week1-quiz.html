<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI × Web3 · Week 1 Quiz</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Noto Sans SC', -apple-system, sans-serif;
    background: #0a0a0b;
    color: #e4e4e7;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 16px;
  }
  .container {
    max-width: 600px;
    width: 100%;
  }
  .header {
    text-align: center;
    margin-bottom: 32px;
  }
  .header h1 {
    font-size: 24px;
    font-weight: 600;
    letter-spacing: -0.02em;
    background: linear-gradient(135deg, #fb923c, #60a5fa, #a78bfa);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .header p {
    color: #71717a;
    font-size: 13px;
    margin-top: 6px;
    font-weight: 300;
  }
  .progress-bar {
    height: 4px;
    background: #1f1f23;
    border-radius: 2px;
    margin-bottom: 24px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #fb923c, #60a5fa);
    border-radius: 2px;
    transition: width 0.4s ease;
  }
  .question-card {
    background: #141416;
    border: 1px solid #1f1f23;
    border-radius: 12px;
    padding: 28px;
    margin-bottom: 16px;
  }
  .question-card .q-num {
    font-size: 11px;
    color: #52525b;
    font-weight: 500;
    margin-bottom: 8px;
    letter-spacing: 0.05em;
  }
  .question-card .q-tag {
    display: inline-block;
    font-size: 10px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 4px;
    margin-bottom: 12px;
  }
  .q-tag-ai { background: #1c1917; color: #fb923c; border: 1px solid #292524; }
  .q-tag-web3 { background: #0f172a; color: #60a5fa; border: 1px solid #1e293b; }
  .q-tag-cross { background: #1a1625; color: #a78bfa; border: 1px solid #2e1e4a; }
  .question-card h3 {
    font-size: 16px;
    font-weight: 500;
    color: #f4f4f5;
    margin-bottom: 16px;
    line-height: 1.6;
  }
  .options { display: flex; flex-direction: column; gap: 8px; }
  .option {
    background: #1a1a1e;
    border: 1px solid #27272a;
    border-radius: 8px;
    padding: 12px 16px;
    font-size: 14px;
    color: #d4d4d8;
    cursor: pointer;
    transition: all 0.15s;
    font-family: inherit;
    text-align: left;
  }
  .option:hover { border-color: #3f3f46; background: #1e1e22; }
  .option.selected { border-color: #60a5fa; background: #1e293b; color: #93c5fd; }
  .option.correct { border-color: #22c55e; background: #1a2e1a; color: #86efac; }
  .option.wrong { border-color: #ef4444; background: #2e1a1a; color: #fca5a5; }
  .option.disabled { pointer-events: none; opacity: 0.7; }
  .feedback {
    margin-top: 12px;
    padding: 12px 16px;
    border-radius: 8px;
    font-size: 13px;
    display: none;
    line-height: 1.6;
  }
  .feedback.show { display: block; }
  .feedback.correct { background: #1a2e1a; border: 1px solid #22c55e; color: #86efac; }
  .feedback.wrong { background: #2e1a1a; border: 1px solid #ef4444; color: #fca5a5; }
  .nav-buttons {
    display: flex;
    justify-content: space-between;
    gap: 12px;
  }
  .btn {
    background: #1f1f23;
    border: 1px solid #27272a;
    color: #d4d4d8;
    border-radius: 8px;
    padding: 10px 20px;
    font-size: 14px;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s;
    flex: 1;
  }
  .btn:hover { border-color: #3f3f46; background: #27272a; }
  .btn.primary { background: #3b82f6; border-color: #3b82f6; color: #fff; }
  .btn.primary:hover { background: #2563eb; }
  .btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .results {
    display: none;
    text-align: center;
    padding: 40px 0;
  }
  .results.show { display: block; }
  .results .score {
    font-size: 48px;
    font-weight: 700;
    background: linear-gradient(135deg, #fb923c, #60a5fa, #a78bfa);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .results .label {
    color: #71717a;
    font-size: 14px;
    margin-top: 8px;
  }
  .results .detail {
    color: #52525b;
    font-size: 13px;
    margin-top: 20px;
    line-height: 1.8;
  }
</style>
</head>
<body>
<div class="container">
<div class="header">
  <h1>AI × Web3 · Week 1 Quiz</h1>
  <p>检验你对 LLM · Agent · Wallet · Contract 的理解</p>
</div>

<div class="progress-bar"><div class="progress-fill" id="progressFill" style="width: 0%"></div></div>

<div id="quizArea">
  <div class="question-card" id="questionCard">
    <div class="q-num" id="qNum"></div>
    <span class="q-tag" id="qTag"></span>
    <h3 id="qText"></h3>
    <div class="options" id="options"></div>
    <div class="feedback" id="feedback"></div>
  </div>
  <div class="nav-buttons">
    <button class="btn" id="prevBtn" onclick="prevQuestion()">← 上一题</button>
    <button class="btn primary" id="checkBtn" onclick="checkAnswer()">✓ 检查答案</button>
    <button class="btn" id="nextBtn" onclick="nextQuestion()">下一题 →</button>
  </div>
</div>

<div class="results" id="results">
  <div class="score" id="finalScore"></div>
  <div class="label">/ 20 分 · 每题 2 分</div>
  <div class="detail" id="resultDetail"></div>
  <button class="btn primary" onclick="resetQuiz()" style="margin-top:24px;max-width:200px;margin-left:auto;margin-right:auto;">重新挑战</button>
</div>
</div>

<script>
const quizData = [
  {
    q: 'LLM 的核心工作方式是什么？',
    tag: 'AI', tagClass: 'q-tag-ai',
    options: ['通过规则匹配回答问题', '预测下一个最可能的 token', '从数据库检索答案', '执行预设的 if-else 逻辑'],
    correct: 1,
    explain: 'LLM 的核心是 next token prediction — 通过统计推断预测下一个最可能的 token 来生成文本。不是"理解"，而是概率生成。'
  },
  {
    q: '以下哪个不是 Prompt Engineering 的策略？',
    tag: 'AI', tagClass: 'q-tag-ai',
    options: ['角色设定', 'few-shot 示例', 'chain-of-thought', '修改模型权重'],
    correct: 3,
    explain: '修改模型权重属于 fine-tuning，不是 prompt engineering。角色设定、few-shot 和 chain-of-thought 都是 prompt 层面的策略。'
  },
  {
    q: 'AI Agent 与普通 Chatbot 的核心区别是什么？',
    tag: 'AI', tagClass: 'q-tag-ai',
    options: ['Agent 更聪明', 'Agent 能自主调用工具和执行任务', 'Agent 不用提示词', 'Agent 只能在命令行运行'],
    correct: 1,
    explain: 'Agent 的核心特征是自主性 — 能感知环境、调用工具、做出决策，而不是仅靠对话来响应用户。Agent = LLM + 工具 + 记忆 + 规划。'
  },
  {
    q: 'Hermes Agent 的 Skills 功能解决了什么问题？',
    tag: 'AI', tagClass: 'q-tag-ai',
    options: ['让 Agent 跑得更快', '自动保存和复用工作流程，Agent 从经验中学习', '增加对话趣味性', '替代用户写代码'],
    correct: 1,
    explain: 'Skills 是 Hermes 的核心特性：Agent 从每次任务中自动生成可复用的工作流程，不需要用户手动维护插件库。'
  },
  {
    q: '以下关于 wallet（钱包）的说法，正确的是？',
    tag: 'Web3', tagClass: 'q-tag-web3',
    options: ['钱包就是账号', '钱包是私钥管理器和安全责任入口', '签名就等同于登录', '地址是完全匿名的'],
    correct: 1,
    explain: '钱包不是普通账号，而是私钥、安全责任和链上动作入口。签名不是"点一下确认"，是授权一个具体动作。地址是假名，不是匿名。'
  },
  {
    q: 'Gas 在区块链中代表什么？',
    tag: 'Web3', tagClass: 'q-tag-web3',
    options: ['转账附加费', '计算资源定价和执行约束机制', '网络手续费', '交易税'],
    correct: 1,
    explain: 'Gas 不是单纯的手续费，而是计算资源定价和执行约束机制。失败交易也要付 Gas，因为计算资源已经被消耗了。'
  },
  {
    q: '签名（signature）的正确理解是？',
    tag: 'Web3', tagClass: 'q-tag-web3',
    options: ['确认登录身份', '授权一个具体动作，包含所有交易字段', '点一下确认按钮', '等同于输入密码'],
    correct: 1,
    explain: '签名是授权一个具体动作 — 你在签名时授权的是一笔包含 from/to/value/data/nonce/gas 的完整交易，不是简单的"登录确认"。'
  },
  {
    q: '智能合约与普通后端逻辑的差异，以下哪项正确？',
    tag: 'Web3', tagClass: 'q-tag-web3',
    options: ['合约更安全', '合约状态公开、执行公开、部分不可更改', '合约没有 Bug', '合约是免费的'],
    correct: 1,
    explain: '智能合约的显著特征：状态公开、执行公开、升级权限可检查。部分合约一旦部署就无法更改。'
  },
  {
    q: '关于测试网的描述，错误的是？',
    tag: 'Web3', tagClass: 'q-tag-web3',
    options: ['Sepolia 是常用测试网', '测试币可以免费获取', '测试网交易的 Gas 不用真金白银', '测试网结果与主网完全一样'],
    correct: 3,
    explain: '测试网可以用测试币免费交互，但测试网的环境（共识、节点、状态）与主网并不完全相同。测试通过了不代表主网一定没问题。'
  },
  {
    q: 'AI Agent 在涉及链上操作时，核心安全原则是？',
    tag: 'Cross', tagClass: 'q-tag-cross',
    options: ['Agent 应该完全自动化所有操作', '涉及签名/转账/合约写入必须保留人工确认', '只要代码写好就不会出错', '用主网测试更真实'],
    correct: 1,
    explain: 'AI Agent 不应直接接触私钥/助记词。涉及签名、授权、转账和合约写入的动作必须保留人工确认环节。所有学习和实验先走测试网。'
  }
];

let current = 0;
let answers = new Array(quizData.length).fill(null);
let checked = new Array(quizData.length).fill(false);

function render() {
  const data = quizData[current];
  document.getElementById('qNum').textContent = `第 ${current + 1} / ${quizData.length} 题`;
  document.getElementById('qTag').textContent = data.tag;
  document.getElementById('qTag').className = 'q-tag ' + data.tagClass;
  document.getElementById('qText').textContent = data.q;
  
  const optsDiv = document.getElementById('options');
  optsDiv.innerHTML = '';
  data.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option';
    if (checked[current]) btn.classList.add('disabled');
    if (answers[current] === i) btn.classList.add('selected');
    if (checked[current]) {
      if (i === data.correct) btn.classList.add('correct');
      else if (i === answers[current] && answers[current] !== data.correct) btn.classList.add('wrong');
    }
    btn.textContent = String.fromCharCode(65 + i) + '. ' + opt;
    btn.onclick = () => selectOption(i);
    btn.id = 'opt_' + i;
    optsDiv.appendChild(btn);
  });

  const fb = document.getElementById('feedback');
  if (checked[current]) {
    fb.className = 'feedback show ' + (answers[current] === data.correct ? 'correct' : 'wrong');
    fb.textContent = (answers[current] === data.correct ? '✅ ' : '❌ ') + data.explain;
  } else {
    fb.className = 'feedback';
    fb.textContent = '';
  }

  document.getElementById('prevBtn').disabled = current === 0;
  document.getElementById('nextBtn').disabled = current === quizData.length - 1;
  document.getElementById('checkBtn').disabled = answers[current] === null;
  document.getElementById('progressFill').style.width = ((current + 1) / quizData.length * 100) + '%';
}

function selectOption(i) {
  if (checked[current]) return;
  answers[current] = i;
  render();
}

function checkAnswer() {
  if (answers[current] === null) return;
  checked[current] = true;
  render();
}

function nextQuestion() {
  if (current < quizData.length - 1) { current++; render(); }
}

function prevQuestion() {
  if (current > 0) { current--; render(); }
}

function resetQuiz() {
  answers = new Array(quizData.length).fill(null);
  checked = new Array(quizData.length).fill(false);
  current = 0;
  document.getElementById('results').classList.remove('show');
  document.getElementById('quizArea').style.display = 'block';
  render();
}

function showResults() {
  document.getElementById('quizArea').style.display = 'none';
  const results = document.getElementById('results');
  results.classList.add('show');
  
  let correctCount = 0;
  checked.forEach((c, i) => { if (c && answers[i] === quizData[i].correct) correctCount++; });
  
  const score = correctCount * 2;
  document.getElementById('finalScore').textContent = score;
  
  let comment = '';
  if (score >= 18) comment = '🏆 大师级！你对 Week 1 概念掌握得非常好';
  else if (score >= 14) comment = '👏 不错的理解，再强化一下薄弱环节';
  else if (score >= 10) comment = '📖 基础还可以，建议再看一遍概念卡片';
  else comment = '💪 需要回头看看 Handbook 的推荐材料';
  
  document.getElementById('resultDetail').innerHTML = [
    `正确：${correctCount} / ${quizData.length} 题`,
    comment,
    '',
    '📌 答错的概念：' + quizData.filter((q, i) => !checked[i] || answers[i] !== q.correct).map(q => `「${q.q.substring(0, 20)}...」`).join('、') || '无'
  ].join('<br>');
}

// Override check button to show results on last question
const origCheck = document.getElementById('checkBtn').onclick;
document.getElementById('checkBtn').onclick = function() {
  checkAnswer();
  const allDone = checked.every(c => c);
  if (allDone) setTimeout(showResults, 1200);
};

render();
</script>
</body>
</html>
